<!DOCTYPE html>
<!-- Author: DT -->
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 220px; padding: 15px; font-family: "Helvetica Neue", sans-serif; position: relative; }
    button { 
      width: 100%; padding: 10px; 
      background: #3370ff; color: white; 
      border: none; border-radius: 4px; 
      cursor: pointer; font-size: 14px; font-weight: 500;
      margin-bottom: 10px;
    }
    button:hover { background: #1e5add; }
    
    /* 绿色按钮样式，区分功能 */
    button.secondary {
      background: #26b47f; 
      margin-bottom: 0; /* 最后一个按钮去掉下边距 */
    }
    button.secondary:hover { background: #1f966a; }

    .warning {
      margin-top: 15px;
      padding: 10px;
      background: #fff2f0;
      border: 1px solid #ffccc7;
      border-radius: 4px;
      color: #cf1322;
      font-size: 12px;
      line-height: 1.5;
    }
    .warning strong { display: block; margin-bottom: 4px; }

    /* Toast 浮层提示样式 */
    #toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      display: none; /* 默认隐藏 */
      z-index: 100;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- 调整顺序：打印多维表格(蓝)、粘贴多维表格(蓝)、打印图片(绿)、粘贴图片(绿) -->
  <button id="startBtn">打印多维表格</button>
  <button id="pasteTableBtn">粘贴多维表格</button>
  
  <button id="imagesBtn" >打印图片</button>
  <button id="pasteBtn" >粘贴图片</button>
  
  <input id="imageInput" type="file" accept="image/*" multiple style="display:none" />
  
  <div class="warning">
    <strong>⚠️ 注意事项：</strong>
    1.截图期间请勿移动鼠标或滚动页面，以免造成画面错位。<br>
    2.点击若无反应，刷新页面后再试
  </div>

  <!-- 提示浮层 -->
  <div id="toast">提示信息</div>
  
  <script src="popup.js"></script>
</body>
</html>
